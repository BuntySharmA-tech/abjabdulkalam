<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Dashboard · Smart Jharkhand Tourism</title>
    <link rel="stylesheet" href="/jharkhand-tourism/assets/css/main.css">
  </head>
  <body>
    <div id="app-header"></div>
    <main class="main">
      <h1>Tourist Dashboard</h1>
      <section class="grid-cards section">
        <div class="card"><strong>Saved Itineraries</strong><br><small>None yet</small></div>
        <div class="card"><strong>Bookings</strong><br><small>Homestays, guides</small></div>
        <div class="card"><strong>Eco Points</strong><br><small><span id="eco-points">120</span> points</small></div>
        <div class="card"><strong>Trip Journal</strong><br><small>Upload photos & AI diary</small></div>
        <div class="card"><strong>Share</strong><br><small>Post with eco-badges</small></div>
      </section>
    </main>
    <div id="app-footer"></div>
    <div class="quickbar">
      <button class="quickbtn" id="qa-sos">🚨 SOS</button>
    </div>
    <script src="/jharkhand-tourism/assets/js/main.js" defer></script>
  </body>
  </html>
